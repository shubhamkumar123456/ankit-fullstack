<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 90%;
        min-height: 100vh;
        background-color: black;
        margin: auto;
        color: white;
        display: grid;
        grid-template-columns: repeat(3,auto);
        gap: 10px;
        padding: 10px;
        /* display: none; */
      }

      .box {
        /* background-color: aqua; */
        margin-bottom: 10px;
        display: flex;
        flex-direction: column; 
        align-items: center;
        justify-content: space-evenly;
        gap: 20px;
        padding: 20px;
        border: 1px solid orange;
        border-radius: 20px;
      }

      .box button{
        width: 100%;
        padding: 10px;
        border-radius: 10px;
      }

      .box img{
        /* max-height: 300px; */
      }
      nav{
        width: 100%;
        height: 60px;
        background-color: turquoise;
        margin-bottom: 10px;
        display: flex;
        justify-content:space-between ;
        align-items: center;
        padding: 0 40px;
        position: relative;
      }

      .ulWeb{
        display: flex;
        gap: 30px;
        list-style: none;
        /* background-color: yellow; */
      }

      .ulWeb a{
        text-decoration: none;
      }

      .ulMobile{
        display: none;
        background-color: black;
        color: white;
        list-style: none;
        position: absolute;
        left: 0;
        top: 100%;
        width: 100%;
        /* display: flex; */
        flex-direction: column;
        align-items: center;
      }
      .ulMobile li{
        /* background-color: brown; */
        width: 100%;
        text-align: center;
      }
      .ulMobile li a{
        text-decoration: none;
        color: white;
        border-bottom: 1px solid;
        width: 100%;
        display: block;
        padding: 10px;
      }



      button{
        display: none;
      }

      @media only screen and (max-width:691px){
        .ulWeb{
          display: none;
        }

        button{
          display: block;
        }

        .container{
          grid-template-columns: repeat(1,auto);
        }
      }
    </style>
  </head>
  <body>

    <nav>
        <h3>Website</h3>

        <ul class="ulWeb">
          <li><a href="">Home</a></li>
          <li><a href="">About</a></li>
          <li><a href="">Cart <sup>0</sup></a></li>
          <li><a href="">Profile</a></li>
          <li><a href="">Profile</a></li>
        </ul>

        <ul class="ulMobile">
          <li><a href="">Home</a></li>
          <li><a href="">About</a></li>
          <li><a href="">Cart</a></li>
          <li><a href="">Profile</a></li>
          <li><a href="">Profile</a></li>
        </ul>

        <button onclick="handleMenu()"><i class="bi bi-list"></i></button>
    </nav>

    <div class="container">
     
    </div>

    <h1 id="demo"></h1>
    <script>
      let obj = {
        name: "one",
        age: 34,
      };
      console.log(obj);

      // Object --> JSON.stingify , JSON.Parse -->
      // let res =  fetch('https://dummyjson.com/products') //async task
      // res.then((ans)=>ans.json()).then((ans)=>console.log(ans.products)).then(()=>console.log("hello"))
      // .catch((ans)=>console.log(ans))

      let containerTag = document.querySelector(".container");

      let h1 = document.querySelector("#demo");
      // h1.innerHTML = "<p>hello <p>"
      // h1.innerText = "<p>hello <p>"
      console.log(h1);

      async function getData() {
        let res = await fetch("https://dummyjson.com/products");
        let data = await res.json(); //parse the Data
        // console.log(data);  // {products:[], limit:0, skip:0}
        // console.log(data.products)  // [{} , {} , {} , {} , ...30]

        data.products.forEach((val, i) => {
          // console.log(val)
          // console.log(val.title)

          containerTag.innerHTML = containerTag.innerHTML +
            ` <div class="box">
                <img src=${val.thumbnail} alt="">

            <h3>${val.title}</h3>
            <p>${val.price} </p>
            <button>Add to Cart</button>
        </div> `;
        });
      }

      getData();



      let mobileUl = document.querySelector('.ulMobile');
      console.log(mobileUl)

      function handleMenu(){
        // console.log("running")
        if(mobileUl.style.display === "none"){
          mobileUl.style.display = "block"
        }
        else{
          mobileUl.style.display = "none"
        }
      }


    //   Homework --> 'https://dummyjson.com/recipes'
    </script>
  </body>
</html>
